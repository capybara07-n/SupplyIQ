services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supplyiq
      POSTGRES_USER: supplyiq
      POSTGRES_PASSWORD: supplyiq
    ports:
      - "5432:5432"
    volumes:
      - supplyiq_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplyiq"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  supplyiq_data:

